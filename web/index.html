<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Aetron, a modern fitness tracking app for workouts, goals, history, and progress.">
  <meta name="google-signin-client_id" content="741155040974-vj5atqn3ev6ehnnd15k1a93hi2thkj0o.apps.googleusercontent.com">

  <!-- Google Identity Services Web SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.aetronGoogleSignIn = function(clientId, nonce) {
      return new Promise(function(resolve, reject) {
        function tryGsi() {
          if (!window.google || !window.google.accounts || !window.google.accounts.id) {
            setTimeout(tryGsi, 100);
            return;
          }

          var isCompleted = false;

          var initConfig = {
            client_id: clientId,
            callback: function(response) {
              if (response && response.credential) {
                isCompleted = true;
                resolve(response.credential);
              } else {
                reject(new Error("No credential returned from Google"));
              }
            },
            auto_select: false,
            cancel_on_tap_outside: true,
            use_fedcm_for_prompt: false
          };

          if (nonce) {
            initConfig.nonce = nonce;
          }

          window.google.accounts.id.initialize(initConfig);

          // 1. First attempt: Prompt GIS One Tap / Account Picker
          window.google.accounts.id.prompt(function(notification) {
            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
              if (!isCompleted) {
                // 2. Second attempt: Trigger Google Sign-In Popup Button
                var btn = document.getElementById('aetron_gsi_btn');
                if (!btn) {
                  btn = document.createElement('div');
                  btn.id = 'aetron_gsi_btn';
                  btn.style.position = 'fixed';
                  btn.style.top = '-9999px';
                  btn.style.left = '-9999px';
                  btn.style.opacity = '0';
                  btn.style.pointerEvents = 'none';
                  document.body.appendChild(btn);
                }
                window.google.accounts.id.renderButton(btn, {
                  type: 'standard',
                  theme: 'outline',
                  size: 'large'
                });
                setTimeout(function() {
                  var innerBtn = btn.querySelector('div[role=button]');
                  if (innerBtn) {
                    innerBtn.click();
                  }
                }, 50);
              }
            }
          });
        }
        tryGsi();
      });
    };
  </script>

  <!-- Theme Colors -->
  <meta name="theme-color" content="#0A0D1C">
  <meta name="msapplication-TileColor" content="#0A0D1C">

  <!-- iOS PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aetron">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=aetron_v5">
  <link rel="apple-touch-icon-precomposed" href="icons/apple-touch-icon.png?v=aetron_v5">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=aetron_v5">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=aetron_v5">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png?v=aetron_v5">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=aetron_v5">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png?v=aetron_v5">
  <link rel="icon" type="image/png" href="favicon.png?v=aetron_v5"/>

  <title>Aetron</title>
  <link rel="manifest" href="manifest.json?v=aetron_v5">

  <!-- Auto-Update & Service Worker Lifecycle Script -->
  <script>
    if ('serviceWorker' in navigator) {
      // Check for Service Worker updates immediately on load
      window.addEventListener('load', function () {
        navigator.serviceWorker.ready.then(function (registration) {
          registration.update();
        });
      });

      // When a new Service Worker takes control, auto-reload once to show latest version
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>
</head>

<body style="background-color: #0A0D1C; margin: 0; padding: 0; overflow: hidden;">

  <!-- ═══════════════════════════════════════════════
       AETRON — Custom Splash / Loading Screen
       GPS globe loading screen
  ════════════════════════════════════════════════ -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    * { box-sizing: border-box; }

    #aetron-splash {
      position: fixed;
      inset: 0;
      background: #0A0D1C;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #aetron-splash.fade-out {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* ── GPS globe ── */
    .splash-globe-wrap {
      position: relative;
      width: 132px;
      height: 132px;
      margin-bottom: 40px;
    }

    .splash-orbit {
      position: absolute;
      inset: 8px -18px;
      border-radius: 50%;
      border: 1px solid rgba(128, 216, 255, 0.36);
      transform: rotate(-27deg);
      animation: orbitPulse 2.4s ease-in-out infinite;
    }

    .splash-orbit::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      top: -4px;
      left: 50%;
      border-radius: 50%;
      background: #B8EEFF;
      box-shadow: 0 0 12px #20B2FF;
    }

    @keyframes orbitPulse {
      0%, 100% { opacity: 0.42; transform: rotate(-27deg) scale(0.98); }
      50% { opacity: 0.9; transform: rotate(-27deg) scale(1.04); }
    }

    .splash-globe {
      position: relative;
      z-index: 2;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid rgba(128, 216, 255, 0.72);
      background:
        radial-gradient(circle at 35% 28%, rgba(128, 216, 255, 0.4), transparent 28%),
        radial-gradient(circle at 70% 78%, rgba(21, 101, 192, 0.7), transparent 46%),
        #0B1A2A;
      box-shadow:
        inset -14px -12px 24px rgba(0, 0, 0, 0.46),
        0 0 30px rgba(32, 178, 255, 0.22),
        0 8px 32px rgba(0, 0, 0, 0.6);
      animation: globeFloat 3s ease-in-out infinite;
    }

    .splash-globe::before,
    .splash-globe::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 19px,
        rgba(128, 216, 255, 0.24) 20px,
        transparent 21px
      );
      transform: scaleX(0.92);
    }

    .splash-globe::after {
      background: repeating-linear-gradient(
        to right,
        transparent 0,
        transparent 20px,
        rgba(128, 216, 255, 0.22) 21px,
        transparent 22px
      );
      transform: scaleX(0.66);
    }

    @keyframes globeFloat {
      0%, 100% { transform: translateY(0px);  }
      50%       { transform: translateY(-6px); }
    }

    /* ── App name ── */
    .splash-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #FFFFFF;
      margin: 0 0 6px;
      background: linear-gradient(135deg, #FFFFFF 0%, #20B2FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .splash-tagline {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin: 0 0 48px;
    }

    /* ── Progress bar ── */
    .splash-progress-track {
      width: 180px;
      height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .splash-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1565C0 0%, #20B2FF 60%, #80D8FF 100%);
      border-radius: 999px;
      box-shadow: 0 0 8px rgba(32, 178, 255, 0.6);
      animation: loadBar 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes loadBar {
      0%   { width: 0%;   }
      30%  { width: 40%;  }
      60%  { width: 70%;  }
      85%  { width: 88%;  }
      100% { width: 100%; }
    }

    /* ── Bottom label ── */
    .splash-status {
      margin-top: 20px;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      animation: statusBlink 1.6s ease-in-out infinite;
    }

    @keyframes statusBlink {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 0.8; }
    }
  </style>

  <div id="aetron-splash">
    <div class="splash-globe-wrap" role="img" aria-label="GPS globe loading">
      <div class="splash-orbit"></div>
      <div class="splash-globe"></div>
    </div>

    <p class="splash-title">Aetron</p>
    <p class="splash-tagline">Train. Track. Dominate.</p>

    <div class="splash-progress-track">
      <div class="splash-progress-bar"></div>
    </div>
    <p class="splash-status">Loading&hellip;</p>
  </div>

  <script>
    // Remove splash screen once Flutter is fully initialised
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('aetron-splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function () { splash.remove(); }, 650);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
