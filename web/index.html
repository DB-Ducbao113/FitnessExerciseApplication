<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Aetron, a modern fitness tracking app for workouts, goals, history, and progress.">
  <meta name="google-signin-client_id" content="741155040974-vj5atqn3ev6ehnnd15k1a93hi2thkj0o.apps.googleusercontent.com">

  <!-- Google Identity Services Web SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.aetronGoogleSignIn = function(clientId, nonce) {
      return new Promise(function(resolve, reject) {
        function tryGsi() {
          if (!window.google || !window.google.accounts || !window.google.accounts.id) {
            setTimeout(tryGsi, 100);
            return;
          }

          var isCompleted = false;

          var initConfig = {
            client_id: clientId,
            callback: function(response) {
              if (response && response.credential) {
                isCompleted = true;
                resolve(response.credential);
              } else {
                reject(new Error("No credential returned from Google"));
              }
            },
            auto_select: false,
            cancel_on_tap_outside: true,
            use_fedcm_for_prompt: false
          };

          if (nonce) {
            initConfig.nonce = nonce;
          }

          window.google.accounts.id.initialize(initConfig);

          // 1. First attempt: Prompt GIS One Tap / Account Picker
          window.google.accounts.id.prompt(function(notification) {
            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
              if (!isCompleted) {
                // 2. Second attempt: Trigger Google Sign-In Popup Button
                var btn = document.getElementById('aetron_gsi_btn');
                if (!btn) {
                  btn = document.createElement('div');
                  btn.id = 'aetron_gsi_btn';
                  btn.style.position = 'fixed';
                  btn.style.top = '-9999px';
                  btn.style.left = '-9999px';
                  btn.style.opacity = '0';
                  btn.style.pointerEvents = 'none';
                  document.body.appendChild(btn);
                }
                window.google.accounts.id.renderButton(btn, {
                  type: 'standard',
                  theme: 'outline',
                  size: 'large'
                });
                setTimeout(function() {
                  var innerBtn = btn.querySelector('div[role=button]');
                  if (innerBtn) {
                    innerBtn.click();
                  }
                }, 50);
              }
            }
          });
        }
        tryGsi();
      });
    };
  </script>

  <!-- Theme Colors -->
  <meta name="theme-color" content="#0A0D1C">
  <meta name="msapplication-TileColor" content="#0A0D1C">

  <!-- iOS PWA meta tags & icons -->

  <title>Aetron</title>
  <link rel="manifest" href="manifest.json?v=aetron_v5">

  <!-- Auto-Update & Service Worker Lifecycle Script -->
  <script>
    if ('serviceWorker' in navigator) {
      // Check for Service Worker updates immediately on load
      window.addEventListener('load', function () {
        navigator.serviceWorker.ready.then(function (registration) {
          registration.update();
        });
      });

      // When a new Service Worker takes control, auto-reload once to show latest version
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>
</head>
