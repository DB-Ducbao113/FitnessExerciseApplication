name: Pull request quality and security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'EKF+DBSCAN']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  edge-functions:
    name: Deno lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.7
      - run: deno lint supabase/functions
      - name: Type-check every Edge Function
        run: |
          find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print0 \
            | xargs -0 -n1 deno check
      - run: deno test --allow-env supabase/functions

  database:
    name: Database migrations, lint and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start clean local database and replay migrations
        run: npx --yes supabase@2.120.0 db start
      - name: Lint database functions and schema
        run: npx --yes supabase@2.120.0 db lint --local --fail-on error
      - name: Run database integration tests
        run: |
          set -e
          for test_file in supabase/tests/*.sql; do
            echo "Running $test_file"
            docker exec -i supabase_db_backend \
              psql -v ON_ERROR_STOP=1 -U postgres -d postgres < "$test_file"
          done
      - name: Stop local database
        if: always()
        run: npx --yes supabase@2.120.0 stop --no-backup

  dependency-security:
    name: Dependency, secret and config scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: OSV dependency audit
        uses: google/osv-scanner-action/osv-scanner-action@e69cc6c86b31f1e7e23935bbe7031b50e51082de # v2.0.2
        with:
          scan-args: |-
            --lockfile=pubspec.lock
      - name: Trivy source and configuration audit
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          skip-dirs: build,.dart_tool
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
