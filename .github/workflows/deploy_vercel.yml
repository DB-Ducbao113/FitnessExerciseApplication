name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - feat/gps-pipeline-state-refactor
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔨 Build Flutter Web Release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID"

      - name: 📋 Copy Vercel Configuration to Build Output
        run: |
          mkdir -p .vercel/output/static
          cp -R build/web/. .vercel/output/static/
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "${{ secrets.VERCEL_ORG_ID }}" \
            "${{ secrets.VERCEL_PROJECT_ID }}" > .vercel/project.json
          cp tooling/vercel-output-config.json .vercel/output/config.json

      - name: 🚀 Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
