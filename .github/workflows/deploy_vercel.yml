name: Deploy Flutter Web to Vercel

# Pipeline design:
#   pull request / push      -> .github/workflows/ci.yml
#   workflow_dispatch        -> lint + test + build -> human-triggered production deploy
# Production deploys therefore never happen automatically: they require an
# explicit "Run workflow" action (and, once configured, an approval on the
# `production` environment — see the `environment:` key on the deploy job).
#
# Build/deploy secrets are therefore never exposed to pull requests.

on:
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# One pipeline at a time per ref; never cancel a deployment in flight.
concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 🔍 Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🔐 Preflight — required build secrets present?
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_WEB_CLIENT_ID GOOGLE_IOS_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub Actions secret::$name is not configured (Settings -> Secrets and variables -> Actions). The value is never printed."
              missing=1
            fi
          done
          exit "$missing"

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Static Analysis (quality gate)
        run: flutter analyze

      - name: 🧪 Tests (quality gate)
        run: flutter test

      - name: 🔨 Build Flutter Web Release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          flutter build web --release --base-href /app/ \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID"

      - name: 📋 Assemble Vercel Build Output API structure
        run: |
          mkdir -p .vercel/output/static/app
          cp -R build/web/. .vercel/output/static/app/
          cp web/terms.html .vercel/output/static/terms.html
          cp web/google374a2a550d094d6f.html .vercel/output/static/google374a2a550d094d6f.html
          cp tooling/vercel-output-config.json .vercel/output/config.json

      - name: 📤 Upload prebuilt output (consumed by the deploy job)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vercel-prebuilt
          path: .vercel/output
          retention-days: 1
          if-no-files-found: error

      - name: 📝 Build job summary
        if: always()
        run: |
          echo "### Build job: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stages: checkout -> secret preflight -> pub get -> analyze -> test -> build web -> assemble Vercel output" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 🚀 Deploy to Vercel (production)
    needs: build                              # deploy only if analyze + tests + build ALL succeeded
    if: github.event_name == 'workflow_dispatch'   # explicit confirmation required — no auto prod deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production                   # add "Required reviewers" in repo settings to force an approval

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 📥 Download prebuilt output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vercel-prebuilt
          path: .vercel/output

      - name: ✅ Verify prebuilt output integrity
        run: |
          fail=0
          if [ ! -f .vercel/output/config.json ]; then
            echo "::error title=Bad artifact::.vercel/output/config.json missing after download"
            fail=1
          fi
          if [ ! -d .vercel/output/static/app ] || [ ! -f .vercel/output/static/app/index.html ]; then
            echo "::error title=Bad artifact::.vercel/output/static/app/index.html missing after download"
            fail=1
          fi
          exit "$fail"

      - name: 🔐 Preflight — required Vercel secrets present?
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub Actions secret::$name is not configured (Settings -> Secrets and variables -> Actions). The value is never printed. This is the check that replaces amondnet/vercel-action's 'Input required and not supplied: vercel-token'."
              missing=1
            fi
          done
          exit "$missing"

      - name: 🔍 Diagnose Vercel API access & link project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Secrets pasted by hand often carry stray whitespace/newlines
          # (which make URLs/JSON invalid). Tokens and IDs never contain
          # legitimate whitespace - strip it defensively.
          VERCEL_TOKEN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]')
          VERCEL_ORG_ID=$(printf '%s' "$VERCEL_ORG_ID" | tr -d '[:space:]')
          VERCEL_PROJECT_ID=$(printf '%s' "$VERCEL_PROJECT_ID" | tr -d '[:space:]')
          echo "Linking projectId=$VERCEL_PROJECT_ID orgId=$VERCEL_ORG_ID (token length ${#VERCEL_TOKEN})"
          if ! npx --yes vercel@63.1.2 whoami --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "::warning title=whoami inconclusive::vercel whoami could not resolve a user for this token. This is NORMAL for team-scoped or granular tokens and does NOT mean the token is invalid - the project API probe below is the authoritative check."
          else
            echo "Token identity: OK (account email withheld from logs)"
          fi
          code=$(curl -s -o /tmp/vercel_probe.json -w "%{http_code}" --max-time 20 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID") || code="curl-exit-$?"
          echo "Project settings probe HTTP status: $code"
          case "$code" in
            200)
              echo "Token can read the project - linkage OK."
              mkdir -p .vercel
              printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
              ;;
            401) echo "::error title=HTTP 401::VERCEL_TOKEN was rejected (invalid or revoked). Recreate the token and update the VERCEL_TOKEN secret."; exit 1;;
            403) echo "::error title=HTTP 403::Token is valid but has NO ACCESS to this team project. Your Vercel account must be a Member of the owning team (team_a1d2s7caXDI2Zvd0dKGwlvsh) - ask the team owner for an invite, accept it, then retry (Full Account tokens pick up team membership automatically)."; exit 1;;
            404) echo "::error title=HTTP 404::Project not visible: either the VERCEL_PROJECT_ID/VERCEL_ORG_ID secrets are wrong (expected projectId prj_8arwUQrc9hKH1WDG65OwgLNtu9Xf, orgId team_a1d2s7caXDI2Zvd0dKGwlvsh) or the token's Vercel account is not a member of the owning team."; exit 1;;
            *)   echo "::error title=Probe failed ($code)::curl/api failure. curl exit 3 = malformed URL (check the ID secrets for stray characters); other codes = network/proxy issue. Body: $(head -c 300 /tmp/vercel_probe.json 2>/dev/null | tr '\n' ' ')"; exit 1;;
          esac

      - name: 🚀 Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # Pinned CLI version for reproducible deploys (bump deliberately).
        # GitHub masks secret values in logs; the token is only ever read from
        # this environment variable, never written into the repository.
        run: npx --yes vercel@63.1.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: 🩺 Production smoke check
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --max-time 20 https://aetrongps.vercel.app/app/ >/dev/null

      - name: 📝 Deploy job summary
        if: always()
        run: |
          echo "### Deploy job: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }} (production deploy runs only on workflow_dispatch)" >> "$GITHUB_STEP_SUMMARY"
